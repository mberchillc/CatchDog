<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-label="Turi Gestión · espacio privado y códigos PAS · mockup"><title>Turi Gestión · espacio privado y códigos PAS · mockup</title><rect x="0" y="0" width="1200" height="780" rx="24" fill="#e6e0d7" stroke="none"/><rect x="20" y="20" width="1160" height="740" rx="18" fill="#f2eee7" stroke="none"/><rect x="20" y="20" width="1160" height="42" rx="18" fill="#fffaf3" stroke="none"/><circle cx="43" cy="41" r="5" fill="#d0b3a7"/><circle cx="62" cy="41" r="5" fill="#ddc8a1"/><circle cx="81" cy="41" r="5" fill="#b5c9bc"/><text x="480" y="46" fill="#788787" font-family="Arial,sans-serif" font-size="11" font-weight="600">TURI GESTIÓN · VISTA DEL PRODUCTO</text><image x="58" y="91" width="100" height="38" href="data:image/png;base64,"/><text x="162" y="121" fill="#304958" font-family="Arial,sans-serif" font-size="12" font-weight="600">GESTIÓN</text><rect x="918" y="90" width="213" height="34" rx="17" fill="#dcecf2" stroke="none"/><text x="941" y="112" fill="#456f80" font-family="Arial,sans-serif" font-size="11" font-weight="600">ACCESO PERSONAL</text><text x="60" y="198" fill="#20353e" font-family="Georgia,sans-serif" font-size="35" font-weight="600">Tu código. Tu cartera. Tu tranquilidad.</text><text x="61" y="233" fill="#71838a" font-family="Arial,sans-serif" font-size="15" font-weight="400">Los accesos pertenecen al productor. La gestión se vuelve más simple.</text><rect x="60" y="272" width="680" height="393" rx="17" fill="#fffdf9" stroke="none"/><text x="85" y="313" fill="#20353e" font-family="Georgia,sans-serif" font-size="25" font-weight="600">Mis compañías</text><rect x="614" y="290" width="99" height="29" rx="14" fill="#e4f0f4" stroke="none"/><text x="635" y="310" fill="#3e6c7f" font-family="Arial,sans-serif" font-size="13" font-weight="600">3 de 10</text><rect x="83" y="346" width="635" height="77" rx="10" fill="#f5f2ed" stroke="none"/><text x="105" y="374" fill="#304958" font-family="Arial,sans-serif" font-size="19" font-weight="600">La Segunda</text><text x="105" y="399" fill="#76848a" font-family="Arial,sans-serif" font-size="12" font-weight="400">Código PAS resguardado · versión 1</text><rect x="449" y="366" width="248" height="28" rx="14" fill="#f8e9d5" stroke="none"/><text x="463" y="385" fill="#8f6b3f" font-family="Arial,sans-serif" font-size="12" font-weight="400">Integración pendiente de validar</text><rect x="83" y="436" width="635" height="77" rx="10" fill="#f5f2ed" stroke="none"/><text x="105" y="464" fill="#304958" font-family="Arial,sans-serif" font-size="19" font-weight="600">Rivadavia</text><text x="105" y="489" fill="#76848a" font-family="Arial,sans-serif" font-size="12" font-weight="400">Código PAS resguardado · versión 1</text><rect x="449" y="456" width="248" height="28" rx="14" fill="#f8e9d5" stroke="none"/><text x="463" y="475" fill="#8f6b3f" font-family="Arial,sans-serif" font-size="12" font-weight="400">Integración pendiente de validar</text><rect x="83" y="526" width="635" height="77" rx="10" fill="#f5f2ed" stroke="none"/><text x="105" y="554" fill="#304958" font-family="Arial,sans-serif" font-size="19" font-weight="600">San Cristóbal</text><text x="105" y="579" fill="#76848a" font-family="Arial,sans-serif" font-size="12" font-weight="400">Código PAS resguardado · versión 1</text><rect x="449" y="546" width="248" height="28" rx="14" fill="#f8e9d5" stroke="none"/><text x="463" y="565" fill="#8f6b3f" font-family="Arial,sans-serif" font-size="12" font-weight="400">Integración pendiente de validar</text><rect x="84" y="627" width="183" height="35" rx="9" fill="#4bafe1" stroke="none"/><text x="102" y="650" fill="#20353e" font-family="Arial,sans-serif" font-size="14" font-weight="600">+ Agregar compañía</text><rect x="766" y="272" width="372" height="192" rx="17" fill="#dfeef2" stroke="none"/><text x="791" y="312" fill="#20353e" font-family="Georgia,sans-serif" font-size="26" font-weight="600">Vos tenés el control.</text><text x="791" y="352" fill="#42616e" font-family="Arial,sans-serif" font-size="14" font-weight="400">Usuario, contraseña y código personal</text><text x="791" y="383" fill="#42616e" font-family="Arial,sans-serif" font-size="14" font-weight="400">Códigos cifrados por productor</text><text x="791" y="414" fill="#42616e" font-family="Arial,sans-serif" font-size="14" font-weight="400">Historial de cambios y versiones</text><rect x="766" y="486" width="372" height="179" rx="17" fill="#fff9ed" stroke="none"/><text x="791" y="526" fill="#20353e" font-family="Georgia,sans-serif" font-size="23" font-weight="600">El estado, siempre claro.</text><text x="791" y="561" fill="#6d7a7e" font-family="Arial,sans-serif" font-size="13" font-weight="400">Registrar un código prepara la conexión.</text><text x="791" y="585" fill="#6d7a7e" font-family="Arial,sans-serif" font-size="13" font-weight="400">Cada cotizador se habilita después de</text><text x="791" y="609" fill="#6d7a7e" font-family="Arial,sans-serif" font-size="13" font-weight="400">validar permisos y pruebas reales.</text><text x="60" y="721" fill="#8b9797" font-family="Arial,sans-serif" font-size="10" font-weight="600">MOCKUP · REGISTROS ILUSTRATIVOS · SIN CONEXIÓN A ASEGURADORAS</text></svg>